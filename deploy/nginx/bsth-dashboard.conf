# DATA BSTH — nginx: เสิร์ฟหน้าเว็บที่ build แล้ว + ส่ง /api ต่อให้ backend (127.0.0.1:4000)
#
# ติดตั้ง (Ubuntu/Debian):
#   sudo cp deploy/nginx/bsth-dashboard.conf /etc/nginx/sites-available/bsth-dashboard
#   sudo ln -s /etc/nginx/sites-available/bsth-dashboard /etc/nginx/sites-enabled/
# ติดตั้ง (Rocky/RHEL):
#   sudo cp deploy/nginx/bsth-dashboard.conf /etc/nginx/conf.d/bsth-dashboard.conf
# แล้ว:
#   sudo nginx -t && sudo systemctl reload nginx
#
# ต้องแก้: server_name (ชื่อเว็บ / IP ของ server) · root (ถ้าติดตั้งที่อื่น) · พอร์ต backend (ถ้าเปลี่ยน PORT ใน .env)
# HTTPS: ดูส่วนท้ายไฟล์

upstream bsth_backend {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name dashboard.bsth.local;        # ← เปลี่ยนเป็นชื่อเว็บ หรือ IP ของ server

    root /opt/bsth-dashboard/frontend/dist;
    index index.html;

    server_tokens off;
    # แนบรูปในเรื่องแจ้งปัญหาได้รวมราว 20 MB (backend จำกัดไว้ 22 MB)
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ช่องสัญญาณสด (SSE) — ต้องไม่พักข้อมูล และเปิดค้างได้นาน ไม่งั้นหน้าเว็บไม่รู้ทันทีเมื่อปิดปรับปรุง/มีประกาศ
    location = /api/system/events {
        proxy_pass http://bsth_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    # API — X-Forwarded-For = IP เครื่องผู้ใช้ (backend เชื่อเฉพาะที่มาจาก 127.0.0.1) ใช้ในประวัติการใช้งาน/นับผู้เยี่ยมชม
    location /api/ {
        proxy_pass http://bsth_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # รายงานช่วงยาว (ปีงบประมาณ) ใช้เวลานานได้
        proxy_read_timeout 120s;
    }

    # ไฟล์ JS/CSS/ฟอนต์ มีรหัสในชื่อไฟล์ (เปลี่ยนทุกครั้งที่ build) — ให้เบราว์เซอร์จำได้นาน
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # หน้าเว็บ (React) — ทุกเส้นทางใช้ index.html · ห้ามจำ index.html ไม่งั้นอัปเดตเวอร์ชันแล้วผู้ใช้ยังได้ของเก่า
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

# ---------- HTTPS (เมื่อต้องเข้าจากนอกโรงพยาบาล หรือมีใบรับรองของโรงพยาบาล) ----------
# 1) เปลี่ยน "listen 80;" ด้านบนเป็น:
#        listen 443 ssl;
#        http2 on;
#        ssl_certificate     /etc/ssl/bsth/fullchain.pem;
#        ssl_certificate_key /etc/ssl/bsth/privkey.pem;
# 2) เพิ่ม server นี้ให้ http เด้งไป https:
#    server { listen 80; server_name dashboard.bsth.local; return 301 https://$host$request_uri; }
# 3) backend/.env: COOKIE_SECURE=true · APP_PUBLIC_URL=https://ชื่อเว็บ (ปุ่มเปิดดูใน Telegram)
